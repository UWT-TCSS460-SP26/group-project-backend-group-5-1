openapi: 3.0.3
info:
  title: TCSS 460 Group 5 API
  description: |
    **Team:** Group 5
    **Deployed URL:** https://tcss460-group-5-api.onrender.com
    A RESTful API for the TCSS 460 group project.
  version: 0.1.0

servers:
  - url: https://tcss460-group-5-api.onrender.com
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
    description: Health and status routes
  - name: Movies
    description: Movie search, discovery, and details.
  - name: TV
    description: TV show search, discovery, and details.
  - name: Ratings
    description: User ratings for movies and TV shows.
  - name: Reviews
    description: User reviews for movies and TV shows.
  - name: Issues
    description: Public bug report submission endpoints.
  - name: Discovery
    description: Community-ranked discovery feeds. Public — no auth required.

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns 200 OK when the API is alive. No auth required.
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'ok'
                  uptime:
                    type: number
                    example: 3847.2
                  timestamp:
                    type: string
                    format: date-time

  /v1/movies:
    get:
      tags: [Movies]
      summary: Search or discover movies
      description: >
        Returns a list of movies. If a `query` parameter is provided, performs a
        text search via TMDB's search endpoint. Otherwise, uses TMDB's discover
        endpoint with the provided filter parameters.
      parameters:
        - name: query
          in: query
          description: Text search query (e.g. "spiderman"). When provided, all filter parameters are ignored.
          required: false
          schema:
            type: string
          example: spiderman
        - name: limit
          in: query
          description: Maximum number of results to return. Must be a positive integer no greater than 50.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 20
        - name: language
          in: query
          description: Language of results in BCP 47 format.
          required: false
          schema:
            type: string
          example: en-US
        - name: primary_release_date_gte
          in: query
          description: Filter movies released on or after this date (YYYY-MM-DD). Only applies when `query` is not provided.
          required: false
          schema:
            type: string
            format: date
          example: '2020-01-01'
        - name: primary_release_date_lte
          in: query
          description: Filter movies released on or before this date (YYYY-MM-DD). Only applies when `query` is not provided.
          required: false
          schema:
            type: string
            format: date
          example: '2024-12-31'
        - name: with_genres
          in: query
          description: Comma-separated list of TMDB genre IDs to filter by. Only applies when `query` is not provided.
          required: false
          schema:
            type: string
          example: '28,878'
        - name: with_runtime_gte
          in: query
          description: Filter by minimum runtime in minutes. Only applies when `query` is not provided.
          required: false
          schema:
            type: integer
          example: 90
        - name: with_runtime_lte
          in: query
          description: Filter by maximum runtime in minutes. Only applies when `query` is not provided.
          required: false
          schema:
            type: integer
          example: 180
      responses:
        '200':
          description: A list of movies matching the search or filter criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieSummary'
              example:
                - id: 557
                  title: Spider-Man
                  backdrop_path: /zQ8AxTPiCiS5nnwXpwTBPBHSaa5.jpg
                  poster_path: /kjdJntyBeEvqm9w97QGBdxPptzj.jpg
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLimit:
                  summary: Invalid limit value
                  value:
                    error: limit must be a positive integer
                limitTooHigh:
                  summary: Limit exceeds maximum
                  value:
                    error: limit must not exceed 50
        '500':
          description: Internal server error or TMDB API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/movies/popular:
    get:
      tags: [Movies]
      summary: Get popular movies
      description: Returns a list of currently popular movies from TMDB.
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return. Must be a positive integer no greater than 50.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 20
        - name: language
          in: query
          description: Language of results in BCP 47 format.
          required: false
          schema:
            type: string
          example: en-US
      responses:
        '200':
          description: A list of popular movies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieSummary'
              example:
                - id: 557
                  title: Spider-Man
                  backdrop_path: /zQ8AxTPiCiS5nnwXpwTBPBHSaa5.jpg
                  poster_path: /kjdJntyBeEvqm9w97QGBdxPptzj.jpg
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLimit:
                  summary: Invalid limit value
                  value:
                    error: limit must be a positive integer
                limitTooHigh:
                  summary: Limit exceeds maximum
                  value:
                    error: limit must not exceed 50
        '500':
          description: Internal server error or TMDB API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/movies/{id}:
    get:
      tags: [Movies]
      summary: Get a movie by ID
      description: Returns detailed information for a specific movie by its TMDB movie ID.
      parameters:
        - name: id
          in: path
          description: The TMDB movie ID.
          required: true
          schema:
            type: integer
            minimum: 1
          example: 11
      responses:
        '200':
          description: Detailed information about the requested movie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '400':
          description: Invalid movie ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Movie id must be a positive integer
        '404':
          description: Movie not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Movie with id 99999 not found
        '500':
          description: Internal server error or TMDB API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/tv:
    get:
      tags: [TV]
      summary: Search or discover TV shows
      description: >
        Returns a list of TV shows. If a `q` parameter is provided, performs a
        text search via TMDB's search endpoint. Otherwise, uses TMDB's discover
        endpoint with the provided filter parameters.
      parameters:
        - name: q
          in: query
          description: Text search query (e.g. "breaking bad"). When provided, all filter parameters are ignored.
          required: false
          schema:
            type: string
          example: breaking bad
        - name: limit
          in: query
          description: Maximum number of results to return. Must be a positive integer no greater than 50.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 20
        - name: language
          in: query
          description: Language of results in BCP 47 format.
          required: false
          schema:
            type: string
          example: en-US
        - name: first_air_date_gte
          in: query
          description: Filter shows that first aired on or after this date (YYYY-MM-DD). Only applies when `q` is not provided.
          required: false
          schema:
            type: string
            format: date
          example: '2020-01-01'
        - name: first_air_date_lte
          in: query
          description: Filter shows that first aired on or before this date (YYYY-MM-DD). Only applies when `q` is not provided.
          required: false
          schema:
            type: string
            format: date
          example: '2024-12-31'
        - name: with_genres
          in: query
          description: Comma-separated list of TMDB genre IDs to filter by. Only applies when `q` is not provided.
          required: false
          schema:
            type: string
          example: '18,10765'
        - name: with_runtime_gte
          in: query
          description: Filter by minimum episode runtime in minutes. Only applies when `q` is not provided.
          required: false
          schema:
            type: integer
          example: 20
        - name: with_runtime_lte
          in: query
          description: Filter by maximum episode runtime in minutes. Only applies when `q` is not provided.
          required: false
          schema:
            type: integer
          example: 60
      responses:
        '200':
          description: A list of TV shows matching the search or filter criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TvSummary'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLimit:
                  summary: Invalid limit value
                  value:
                    error: limit must be a positive integer
                limitTooHigh:
                  summary: Limit exceeds maximum
                  value:
                    error: limit must not exceed 50
        '500':
          description: Internal server error or TMDB API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/tv/popular:
    get:
      tags: [TV]
      summary: Get popular TV shows
      description: Returns a list of currently popular TV shows from TMDB.
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return. Must be a positive integer no greater than 50.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 20
        - name: language
          in: query
          description: Language of results in BCP 47 format.
          required: false
          schema:
            type: string
          example: en-US
      responses:
        '200':
          description: A list of popular TV shows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TvSummary'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLimit:
                  summary: Invalid limit value
                  value:
                    error: limit must be a positive integer
                limitTooHigh:
                  summary: Limit exceeds maximum
                  value:
                    error: limit must not exceed 50
        '500':
          description: Internal server error or TMDB API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/tv/{id}:
    get:
      tags: [TV]
      summary: Get a TV show by ID
      description: Returns detailed information for a specific TV show by its TMDB ID.
      parameters:
        - name: id
          in: path
          description: The TMDB TV show ID.
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1396
      responses:
        '200':
          description: Detailed information about the requested TV show.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvDetail'
        '400':
          description: Invalid TV show ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: TV show id must be a positive integer
        '404':
          description: TV show not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: TV show with id 99999 not found
        '500':
          description: Internal server error or TMDB API failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ratings/{mediaType}/{mediaId}:
    get:
      tags: [Ratings]
      summary: Get all ratings for a TMDB media item
      description: Returns all ratings for a given TMDB media type and ID.
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rating'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ratings/{mediaType}/{mediaId}/{userId}:
    get:
      tags: [Ratings]
      summary: Get a user's rating for a TMDB media item
      description: Returns the rating for a specific user on a TMDB media item.
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rating found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ratings:
    post:
      tags: [Ratings]
      summary: Create a rating
      description: >
        Creates a new rating for a TMDB item for the authenticated user.
        If the user already has a review for the same media item without a linked rating,
        that review's `ratingId` is automatically updated to reference the new rating.
        Returns 409 if the user has already rated this item.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaId
                - mediaType
                - score
              properties:
                mediaId:
                  type: integer
                  example: 550
                mediaType:
                  type: string
                  enum: [movie, tv]
                  example: movie
                score:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 8
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Rating already exists — use PUT to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ratings/{ratingId}:
    put:
      tags: [Ratings]
      summary: Update a rating
      description: Updates the score of an existing rating belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ratingId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 9
      responses:
        '200':
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Ratings]
      summary: Delete a rating
      description: >
        Deletes a rating belonging to the authenticated user.
        Any review that was linked to this rating will have its `ratingId` automatically cleared to null.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ratingId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Rating deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/reviews/{mediaType}/{mediaId}:
    get:
      tags: [Reviews]
      summary: Get all reviews for a TMDB media item
      description: Returns all reviews for a given TMDB media type and ID.
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/reviews/{mediaType}/{mediaId}/{userId}:
    get:
      tags: [Reviews]
      summary: Get a user's review for a TMDB media item
      description: Returns the review for a specific user on a TMDB media item.
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Review found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/reviews:
    post:
      tags: [Reviews]
      summary: Create a review
      description: >
        Creates a new review for the authenticated user. Do not supply `ratingId` in the request body —
        if the user already has a rating for the same media item, it is automatically linked.
        If no rating exists yet, `ratingId` will be null and can be linked later by creating a rating.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaId
                - mediaType
                - body
              properties:
                mediaId:
                  type: integer
                  example: 550
                mediaType:
                  type: string
                  enum: [movie, tv]
                  example: movie
                body:
                  type: string
                  example: 'This movie was incredible!'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Review already exists — use PUT to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/reviews/{id}:
    put:
      tags: [Reviews]
      summary: Update a review
      description: Updates the body of an existing review belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  example: 'Updated review text.'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Reviews]
      summary: Delete a review
      description: Deletes a review. The owner or an Admin may delete.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Review deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — not the owner or an Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/reviews/admin/{id}:
    delete:
      tags: [Reviews]
      summary: Delete a review (admin)
      description: Deletes any review as an administrator.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Review deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/issues:
    post:
      tags: [Issues]
      summary: Submit a public bug report
      description: Accepts a visitor bug report and persists it as an issue. No auth required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueSubmission'
      responses:
        '201':
          description: Bug report accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueSubmissionResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to save bug report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ratings/me:
    get:
      tags: [Ratings]
      summary: Get the authenticated user's rated items
      description: >
        Returns all ratings belonging to the authenticated user, each enriched with TMDB metadata.
        Identity is derived from the JWT `sub` claim — no `userId` parameter is accepted.
        Items whose TMDB record cannot be found are silently omitted from the response.
        Book ratings (mediaType: book) are included with `tmdb: null`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of the user's ratings enriched with TMDB metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedRating'
              example:
                - rating:
                    id: 1
                    score: 8
                    mediaId: 550
                    mediaType: movie
                    createdAt: '2024-01-01T00:00:00.000Z'
                  tmdb:
                    id: 550
                    title: Fight Club
                    poster_path: /pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg
                    overview: A ticking-time-bomb insomniac and a slippery soap salesman...
        '401':
          description: Unauthorized — JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/discovery/top-rated:
    get:
      tags: [Discovery]
      summary: Get community top-rated movies and TV shows
      description: >
        Returns up to 20 movies and TV shows ranked by community average rating.
        Requires a minimum of 10 ratings to filter out items with too few votes.
        Each result is enriched with TMDB metadata. Items whose TMDB record cannot
        be found are silently omitted. Public route — no auth required.
      responses:
        '200':
          description: List of top-rated items enriched with TMDB metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveryItem'
              example:
                - mediaId: 550
                  mediaType: movie
                  community_rating: 9.2
                  community_rating_count: 15
                  tmdb:
                    id: 550
                    title: Fight Club
                    poster_path: /pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/discovery/most-reviewed:
    get:
      tags: [Discovery]
      summary: Get community most-reviewed movies and TV shows
      description: >
        Returns up to 20 movies and TV shows ranked by total number of community ratings,
        regardless of score. Each result is enriched with TMDB metadata. Items whose TMDB
        record cannot be found are silently omitted. Public route — no auth required.
      responses:
        '200':
          description: List of most-reviewed items enriched with TMDB metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveryItem'
              example:
                - mediaId: 1396
                  mediaType: tv
                  community_rating: 8.8
                  community_rating_count: 42
                  tmdb:
                    id: 1396
                    name: Breaking Bad
                    poster_path: /ggFHVNu6YYI5L9pCfOacjizRGt.jpg
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MovieSummary:
      type: object
      description: A condensed movie object returned from list endpoints.
      properties:
        id:
          type: integer
          description: The TMDB movie ID.
          example: 557
        title:
          type: string
          description: The movie title.
          example: Spider-Man
        backdrop_path:
          type: string
          nullable: true
          description: Relative path to the backdrop image on TMDB's image CDN.
          example: /zQ8AxTPiCiS5nnwXpwTBPBHSaa5.jpg
        poster_path:
          type: string
          nullable: true
          description: Relative path to the poster image on TMDB's image CDN.
          example: /kjdJntyBeEvqm9w97QGBdxPptzj.jpg

    MovieDetail:
      type: object
      description: Detailed movie information returned from the single movie endpoint.
      properties:
        title:
          type: string
          example: Star Wars
        original_title:
          type: string
          example: Star Wars
        overview:
          type: string
          example: A long time ago in a galaxy far, far away...
        tagline:
          type: string
          example: A long time ago in a galaxy far, far away....
        runtime:
          type: integer
          example: 121
        release_date:
          type: string
          format: date
          example: '1977-05-25'
        status:
          type: string
          example: Released
        adult:
          type: boolean
          example: false
        genre_ids:
          type: array
          items:
            type: integer
          example: [12]
        genres:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
          example: [{ id: 12, name: Adventure }]
        original_language:
          type: string
          example: en
        spoken_languages:
          type: array
          items:
            type: object
            properties:
              english_name:
                type: string
              iso_639_1:
                type: string
              name:
                type: string
          example: [{ english_name: English, iso_639_1: en, name: English }]
        budget:
          type: integer
          example: 11000000
        revenue:
          type: integer
          example: 775398007
        poster_path:
          type: string
          nullable: true
          example: /6FfCtAuVAW8XJjZ7eWeLibRLWTw.jpg
        backdrop_path:
          type: string
          nullable: true
          example: /2w4xG178RpB4MDAIfTkqAuSJzec.jpg
        imdb_id:
          type: string
          example: tt0076759
        production_companies:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              logo_path:
                type: string
                nullable: true
              origin_country:
                type: string
        production_countries:
          type: array
          items:
            type: object
            properties:
              iso_3166_1:
                type: string
              name:
                type: string
        belongs_to_collection:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            poster_path:
              type: string
              nullable: true
            backdrop_path:
              type: string
              nullable: true

    TvSummary:
      type: object
      description: A condensed TV show object returned from list endpoints.
      properties:
        id:
          type: integer
          description: The TMDB TV show ID.
          example: 1396
        name:
          type: string
          description: The TV show name.
          example: Breaking Bad
        backdrop_path:
          type: string
          nullable: true
          description: Relative path to the backdrop image on TMDB's image CDN.
          example: /tsRy63Mu5cu8etL1X7ZLyf7UP1M.jpg
        poster_path:
          type: string
          nullable: true
          description: Relative path to the poster image on TMDB's image CDN.
          example: /ggFHVNu6YYI5L9pCfOacjizRGt.jpg

    TvDetail:
      type: object
      description: Detailed TV show information returned from the single TV endpoint.
      properties:
        name:
          type: string
          example: Breaking Bad
        original_name:
          type: string
          example: Breaking Bad
        overview:
          type: string
          example: A chemistry teacher diagnosed with cancer turns to manufacturing drugs.
        tagline:
          type: string
          nullable: true
          example: Change the equation.
        first_air_date:
          type: string
          format: date
          example: '2008-01-20'
        last_air_date:
          type: string
          format: date
          nullable: true
          example: '2013-09-29'
        status:
          type: string
          example: Ended
        type:
          type: string
          example: Scripted
        adult:
          type: boolean
          example: false
        genres:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
          example: [{ id: 18, name: Drama }]
        original_language:
          type: string
          example: en
        spoken_languages:
          type: array
          items:
            type: object
            properties:
              english_name:
                type: string
              iso_639_1:
                type: string
              name:
                type: string
        origin_country:
          type: array
          items:
            type: string
          example: ['US']
        number_of_episodes:
          type: integer
          example: 62
        number_of_seasons:
          type: integer
          example: 5
        seasons:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              episode_count:
                type: integer
              air_date:
                type: string
                format: date
                nullable: true
        episode_run_time:
          type: array
          items:
            type: integer
          example: [45]
        last_episode_to_air:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            episode_number:
              type: integer
            season_number:
              type: integer
        next_episode_to_air:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            episode_number:
              type: integer
            season_number:
              type: integer
        networks:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              logo_path:
                type: string
                nullable: true
              origin_country:
                type: string
        production_companies:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              logo_path:
                type: string
                nullable: true
              origin_country:
                type: string
        production_countries:
          type: array
          items:
            type: object
            properties:
              iso_3166_1:
                type: string
              name:
                type: string
        created_by:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              profile_path:
                type: string
                nullable: true

    Rating:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        mediaId:
          type: integer
        mediaType:
          type: string
        score:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string

    Review:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        mediaId:
          type: integer
        ratingId:
          type: integer
          nullable: true
        mediaType:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string

    IssueSubmission:
      type: object
      description: Payload for creating a public issue report. At least one of title or description is required.
      properties:
        title:
          type: string
          example: Unable to load list of movies
          description: A short summary of the bug.
        description:
          type: string
          example: The movie discovery endpoint returns 500 when search includes dates.
          description: A detailed description of the problem.
        reproSteps:
          type: string
          example: 1. Open /v1/movies 2. Set primary_release_date_gte=2020-01-01 3. Send request
          description: Optional reproduction steps or expected behavior.
        reporter:
          type: string
          example: alice@example.com
          description: Optional name or identifier of the reporter.

    IssueSubmissionResponse:
      type: object
      properties:
        issueId:
          type: integer
          example: 123
        status:
          type: string
          example: Open
        message:
          type: string
          example: Bug report submitted successfully
        createdAt:
          type: string
          format: date-time
          example: '2026-05-02T13:04:00.000Z'

    EnrichedRating:
      type: object
      description: A user's rating paired with TMDB metadata for that item.
      properties:
        rating:
          type: object
          properties:
            id:
              type: integer
              example: 1
            score:
              type: integer
              minimum: 1
              maximum: 10
              example: 8
            mediaId:
              type: integer
              example: 550
            mediaType:
              type: string
              enum: [movie, tv, book]
              example: movie
            createdAt:
              type: string
              format: date-time
        tmdb:
          description: TMDB metadata for the rated item. Null for books or if the item was removed from TMDB.
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/MovieDetail'
            - $ref: '#/components/schemas/TvDetail'

    DiscoveryItem:
      type: object
      description: An aggregated community result enriched with TMDB metadata.
      properties:
        mediaId:
          type: integer
          example: 550
        mediaType:
          type: string
          enum: [movie, tv]
          example: movie
        community_rating:
          type: number
          format: float
          nullable: true
          example: 9.2
        community_rating_count:
          type: integer
          example: 15
        tmdb:
          description: TMDB metadata for this item.
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/MovieDetail'
            - $ref: '#/components/schemas/TvDetail'

    Error:
      type: object
      properties:
        error:
          type: string
          description: A human-readable error message.
          example: Movie with id 99999 not found
